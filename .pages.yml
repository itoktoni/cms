media:
  input: public/uploads
  output: /uploads

content:
  - name: navigation
    label: Menu Navigasi
    path: src/content/settings/navigation.json
    type: file
    fields:
      - name: items
        label: Menu Items
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
          - name: highlight
            label: Tombol Highlight
            type: boolean

  - name: services
    label: Layanan
    path: src/content/services
    type: collection
    view:
      fields: [title, icon, order]
    fields:
      - name: title
        label: Judul Layanan
        type: string
        required: true
      - name: description
        label: Deskripsi Singkat
        type: string
        required: true
      - name: icon
        label: Ikon (emoji)
        type: string
        required: true
      - name: image
        label: Gambar
        type: image
      - name: order
        label: Urutan
        type: number
      - name: body
        label: Konten
        type: rich-text

  - name: articles
    label: Artikel
    path: src/content/articles
    type: collection
    view:
      fields: [title, date, author]
    fields:
      - name: title
        label: Judul Artikel
        type: string
        required: true
      - name: description
        label: Deskripsi Singkat
        type: string
        required: true
      - name: date
        label: Tanggal
        type: date
        required: true
      - name: author
        label: Penulis
        type: string
      - name: image
        label: Gambar Cover
        type: image
      - name: body
        label: Konten
        type: rich-text