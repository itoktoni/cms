branch: content

media:
  input: public/uploads
  output: /uploads

content:
  - name: navigation
    label: Menu Navigasi
    path: src/content/settings/navigation.json
    type: file
    fields:
      - name: items
        label: Menu Items
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
          - name: highlight
            label: Tombol Highlight
            type: boolean

  - name: page-home
    label: "Halaman: Beranda"
    path: src/content/pages/home.json
    type: file
    fields:
      - name: title
        label: Judul Halaman
        type: string
      - name: sections
        label: Sections (Drag & Drop untuk reorder, delete yang tidak perlu)
        type: object
        list: true
        collapsible: true
        fields:
          - name: key
            label: ID Section (jangan diubah)
            type: string
            required: true
            readOnly: true
          - name: heading
            label: Judul Section
            type: string
          - name: description
            label: Deskripsi
            type: string
          - name: badge
            label: Badge
            type: string
          - name: placeholder
            label: Placeholder Input
            type: string
          - name: button_text
            label: Teks Tombol
            type: string
          - name: button_url
            label: URL Tombol
            type: string
          - name: button_secondary_text
            label: Teks Tombol Sekunder
            type: string
          - name: button_secondary_url
            label: URL Tombol Sekunder
            type: string
          - name: link_text
            label: Teks Link
            type: string
          - name: link_url
            label: URL Link
            type: string
          - name: items
            label: Items
            type: object
            list: true
            collapsible: true
            fields:
              - name: title
                label: Judul
                type: string
              - name: subtitle
                label: Subtitle
                type: string
              - name: description
                label: Deskripsi
                type: string
              - name: button_text
                label: Teks Tombol
                type: string
              - name: button_url
                label: URL Tombol
                type: string
              - name: badge
                label: Badge
                type: string
              - name: image
                label: Gambar
                type: image
              - name: icon
                label: Ikon
                type: string
              - name: link_text
                label: Teks Link
                type: string
              - name: link_url
                label: URL Link
                type: string
              - name: featured
                label: Featured
                type: boolean
              - name: style
                label: Style
                type: select
                options:
                  - { value: default, label: Default }
                  - { value: primary, label: Primary }
                  - { value: glass, label: Glass }
              - name: value
                label: Angka
                type: string
              - name: label
                label: Label
                type: string
              - name: name
                label: Nama
                type: string
              - name: client
                label: Nama Klien
                type: string
              - name: industry
                label: Industri
                type: string
              - name: stats
                label: Statistik
                type: object
                list: true
                fields:
                  - name: value
                    label: Angka
                    type: string
                    required: true
                  - name: label
                    label: Label
                    type: string
                    required: true
              - name: quote
                label: Kutipan
                type: string
              - name: author
                label: Nama Penulis
                type: string
              - name: role
                label: Jabatan
                type: string
              - name: company
                label: Perusahaan
                type: string
              - name: rating
                label: Rating (1-5)
                type: number
              - name: number
                label: Nomor
                type: string
          - name: features
            label: Fitur
            type: object
            list: true
            fields:
              - name: icon
                label: Ikon
                type: string
              - name: label
                label: Label
                type: string
          - name: steps
            label: Langkah Proses
            type: object
            list: true
            fields:
              - name: number
                label: Nomor
                type: string
                required: true
              - name: title
                label: Judul
                type: string
                required: true
              - name: description
                label: Deskripsi
                type: string

  - name: page-about
    label: "Halaman: Tentang Kami"
    path: src/content/pages/about.json
    type: file
    fields:
      - name: title
        label: Judul Halaman
        type: string
      - name: sections
        label: Sections
        type: object
        fields:
          - name: hero
            label: Hero
            type: object
            fields:
              - name: enabled
                label: Aktif
                type: boolean
              - name: heading
                label: Judul
                type: string
              - name: subheading
                label: Sub Judul
                type: string
          - name: history
            label: Sejarah
            type: object
            fields:
              - name: enabled
                label: Aktif
                type: boolean
              - name: heading
                label: Judul
                type: string
              - name: description
                label: Deskripsi
                type: string
              - name: milestones
                label: Milestone
                type: object
                list: true
                fields:
                  - name: year
                    label: Tahun
                    type: string
                    required: true
                  - name: title
                    label: Judul
                    type: string
                    required: true
                  - name: description
                    label: Deskripsi
                    type: string
          - name: vision_mission
            label: Visi & Misi
            type: object
            fields:
              - name: enabled
                label: Aktif
                type: boolean
              - name: vision
                label: Visi
                type: string
              - name: missions
                label: Misi
                type: string
                list: true
          - name: certifications
            label: Sertifikasi
            type: object
            fields:
              - name: enabled
                label: Aktif
                type: boolean
              - name: heading
                label: Judul
                type: string
              - name: items
                label: Sertifikasi Items
                type: object
                list: true
                fields:
                  - name: title
                    label: Nama
                    type: string
                    required: true
                  - name: subtitle
                    label: Keterangan
                    type: string
                  - name: icon
                    label: Ikon (emoji)
                    type: string

  - name: services
    label: Layanan
    path: src/content/services
    type: collection
    view:
      fields: [title, icon, order]
    fields:
      - name: title
        label: Judul Layanan
        type: string
        required: true
      - name: description
        label: Deskripsi Singkat
        type: string
        required: true
      - name: icon
        label: Ikon (emoji)
        type: string
        required: true
      - name: image
        label: Gambar
        type: image
      - name: order
        label: Urutan
        type: number
      - name: body
        label: Konten
        type: rich-text

  - name: articles
    label: Artikel
    path: src/content/articles
    type: collection
    view:
      fields: [title, date, author]
    fields:
      - name: title
        label: Judul Artikel
        type: string
        required: true
      - name: description
        label: Deskripsi Singkat
        type: string
        required: true
      - name: date
        label: Tanggal
        type: date
        required: true
      - name: author
        label: Penulis
        type: string
      - name: image
        label: Gambar Cover
        type: image
      - name: body
        label: Konten
        type: rich-text

  - name: page-products
    label: "Halaman: Produk"
    path: src/content/pages/products.json
    type: file
    fields:
      - name: title
        label: Judul Halaman
        type: string
      - name: sections
        label: Sections (Klik + untuk tambah section, drag untuk reorder)
        type: object
        list: true
        collapsible: true
        fields:
          - name: enabled
            label: Aktif
            type: boolean
          - name: heading
            label: Judul Section
            type: string
            required: true
          - name: description
            label: Deskripsi
            type: string
          - name: products
            label: Produk (Klik + untuk tambah produk, drag untuk reorder)
            type: object
            list: true
            collapsible: true
            fields:
              - name: slug
                label: Slug (URL)
                type: string
                required: true
              - name: title
                label: Nama Produk
                type: string
                required: true
              - name: description
                label: Deskripsi
                type: string
                required: true
              - name: image
                label: Gambar
                type: image
              - name: price
                label: Harga
                type: string
              - name: category
                label: Kategori
                type: string
              - name: specs
                label: Spesifikasi
                type: object
                list: true
                fields:
                  - name: label
                    label: Label
                    type: string
                    required: true
                  - name: value
                    label: Nilai
                    type: string
                    required: true
              - name: features
                label: Fitur
                type: string
                list: true
              - name: content
                label: Konten Detail (Markdown)
                type: rich-text

  - name: products
    label: Produk
    path: src/content/products
    type: collection
    view:
      fields: [title, category, section]
    fields:
      - name: title
        label: Nama Produk
        type: string
        required: true
      - name: description
        label: Deskripsi Singkat
        type: string
        required: true
      - name: image
        label: Gambar
        type: image
      - name: price
        label: Harga
        type: string
      - name: category
        label: Kategori
        type: string
        required: true
      - name: section
        label: Section
        type: select
        options:
          - { value: "Alat Diagnostik", label: "Alat Diagnostik" }
          - { value: "Alat Bedah", label: "Alat Bedah" }
          - { value: "Alat Laboratorium", label: "Alat Laboratorium" }
        required: true
      - name: specs
        label: Spesifikasi
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: value
            label: Nilai
            type: string
            required: true
      - name: features
        label: Fitur
        type: string
        list: true
      - name: body
        label: Konten Detail
        type: rich-text